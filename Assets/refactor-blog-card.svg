<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" role="img" aria-labelledby="title desc">
  <title id="title">Revisión y refactorización de código</title>
  <desc id="desc">Un editor de código con cambios, avisos y comprobaciones sobre un fondo azul.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2997ff"/>
      <stop offset="1" stop-color="#0057b8"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#fff" opacity=".2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#002f66" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="900" height="608" fill="url(#background)"/>
  <rect width="900" height="608" fill="url(#dots)"/>
  <circle cx="102" cy="90" r="68" fill="#fff" opacity=".08"/>
  <circle cx="820" cy="520" r="120" fill="#fff" opacity=".07"/>
  <g filter="url(#shadow)">
    <rect x="128" y="70" width="644" height="468" rx="32" fill="#17191e"/>
    <rect x="128" y="70" width="644" height="62" rx="32" fill="#e7f2ff"/>
    <rect x="128" y="106" width="644" height="26" fill="#e7f2ff"/>
    <circle cx="170" cy="101" r="7" fill="#0071e3"/>
    <circle cx="196" cy="101" r="7" fill="#72b8ff"/>
    <circle cx="222" cy="101" r="7" fill="#b8dbff"/>
    <text x="728" y="108" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0071e3">REFACTOR</text>
    <rect x="128" y="132" width="104" height="406" fill="#20242b"/>
    <rect x="148" y="164" width="64" height="10" rx="5" fill="#72b8ff" opacity=".8"/>
    <rect x="148" y="194" width="48" height="10" rx="5" fill="#8e98a8"/>
    <rect x="148" y="224" width="58" height="10" rx="5" fill="#8e98a8"/>
    <rect x="148" y="254" width="38" height="10" rx="5" fill="#8e98a8"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">
      <text x="274" y="184" fill="#8e98a8">01</text>
      <text x="322" y="184" fill="#72b8ff">func</text>
      <text x="378" y="184" fill="#f8f9fb">loadData()</text>
      <text x="510" y="184" fill="#8e98a8">async throws {</text>
      <text x="274" y="226" fill="#8e98a8">02</text>
      <rect x="316" y="202" width="402" height="34" rx="8" fill="#ff5f57" opacity=".18"/>
      <text x="322" y="226" fill="#ff8c87">- try oldAPI.fetch()</text>
      <text x="274" y="268" fill="#8e98a8">03</text>
      <rect x="316" y="244" width="402" height="34" rx="8" fill="#28c840" opacity=".18"/>
      <text x="322" y="268" fill="#72de83">+ try await api.fetchAll()</text>
      <text x="274" y="310" fill="#8e98a8">04</text>
      <text x="322" y="310" fill="#8e98a8">}</text>
    </g>
    <rect x="272" y="358" width="446" height="118" rx="18" fill="#20242b" stroke="#3b4452" stroke-width="2"/>
    <circle cx="310" cy="397" r="15" fill="#ffbd2e"/>
    <path d="M310 387v13M310 407h.1" stroke="#17191e" stroke-width="4" stroke-linecap="round"/>
    <text x="344" y="404" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8f9fb">Errores visibles</text>
    <path d="m306 444 14 14 27-30" fill="none" stroke="#28c840" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="364" y="453" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="19" fill="#b8c0cc">Compilación verificada</text>
  </g>
</svg>
